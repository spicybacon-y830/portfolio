<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index — Luc Ousmane</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .list-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: var(--padding-xxxl);
    }
    .list-content a {
      position: relative;
      width: fit-content;
      font-weight: 400;
      font-size: 24px;
      line-height: 1.3;
    }
    .list-content a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }
    .list-content a:hover::after {
      transform: scaleX(1);
    }

    @media (max-width: 767px) {
      html, body { height: 100%; overflow: hidden; }
      .page { height: 100%; min-height: 100%; }

      .list-content {
        padding: 24px;
        gap: 8px;
      }
      .list-content a { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Desktop header -->
    <header class="header-desktop">
      <div class="header-col header-identity">
        <img class="avatar" src="assets/avatar.jpg" alt="Luc Ousmane">
        <span class="name">Luc Ousmane</span>
      </div>
      <nav class="header-col header-nav">
        <a href="/">Projects</a>
        <a href="about">Resume</a>
        <a href="photos">Photography</a>
      </nav>
      <div class="header-col header-chat">
        <a class="chat-link" href="https://wa.me/qr/4KJXHOG2LYPFI1" target="_blank" rel="noopener">
          <img src="assets/chat-icon.svg" alt="">
          Chat with me
        </a>
      </div>
    </header>

    <!-- Mobile header + expandable menu -->
    <div class="mobile-header-wrap">
      <header class="header-mobile">
        <div class="header-mobile-identity">
          <img class="avatar-sm" src="assets/avatar.jpg" alt="Luc Ousmane">
          <span class="name-sm">Luc Ousmane</span>
        </div>
        <button id="mobile-menu-toggle" aria-label="Menu" aria-expanded="false">
          <img id="mobile-menu-icon" src="assets/plus-icon.svg" alt="">
        </button>
      </header>
      <div class="mobile-menu-panel" id="mobile-menu-panel">
        <nav class="mobile-menu-nav">
          <a href="/">Projects</a>
          <a href="about">Resume</a>
          <a href="photos">Photography</a>
          <a href="list">Index</a>
        </nav>
        <a class="mobile-menu-chat" href="https://wa.me/qr/4KJXHOG2LYPFI1" target="_blank" rel="noopener">
          <img src="assets/chat-icon-small.svg" alt="">
          Chat with me
        </a>
      </div>
    </div>

    <div class="list-content">
      <a href="project-chift">Chift</a>
      <a href="project-grc">GRC</a>
      <a href="project-koala">Koala</a>
      <a href="project-paymium">Paymium</a>
      <a href="project-pixid">Pixid</a>
      <a href="project-primo">Primo</a>
      <a href="project-sobry">Sobry</a>
      <a href="project-suma">Suma</a>
      <a href="project-yampa">Yampa</a>
      <a href="project-yetty">Yetty</a>
    </div>

    <footer>
      <span class="clock"><span id="clock-time"></span> CET</span>
      <a class="footer-index" href="list">Index</a>
      <span class="location">Marseille, France</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
