  <style>
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 100px;
      padding: 24px var(--padding-xxxl);
    }

    .photos-cell {
      position: relative;
      aspect-ratio: 200 / 217;
      background: none;
      border: none;
      padding: 0;
    }

    .photos-cell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    @media (max-width: 767px) {
      .photos-grid {
        display: flex;
        flex-direction: column;
        gap: 100px;
        padding: 24px;
      }
      .photos-cell { height: 211px; aspect-ratio: auto; }
    }

    /* ══════════ LIGHTBOX ══════════ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px var(--padding-xxxl);
      background: var(--color-background);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility 0s linear .3s;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
      transition: opacity .3s ease, visibility 0s;
    }
    html.lightbox-open { overflow: hidden; }

    /* fills the padded box and letterboxes via object-fit, so the displayed
       size depends only on the viewport - swapping the small thumbnail for
       the full-size file never changes it */
    .lightbox-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transform: scale(.98);
      transition: transform .4s cubic-bezier(.2, .8, .2, 1);
    }
    .lightbox.open .lightbox-img { transform: none; }

    .lightbox-close, .lightbox-counter {
      position: absolute;
      font-weight: 300;
      font-size: 16px;
      line-height: 21.6px;
    }
    .lightbox-close {
      background: none;
      border: none;
      padding: 0;
    }
    .lightbox-close { top: 29px; right: var(--padding-xxl); }
    .lightbox-counter {
      bottom: 29px;
      left: var(--padding-xxl);
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
    }
    .lightbox-nav { position: absolute; bottom: 30px; right: var(--padding-xxl); display: flex; gap: 32px; }
    .lightbox-close:hover { color: var(--color-text-muted); }

    @media (max-width: 767px) {
      .lightbox { padding: 70px 24px; }
      .lightbox-close, .lightbox-counter { font-size: 12px; }
      .lightbox-close { top: 24px; right: 24px; }
      .lightbox-counter { bottom: 24px; left: 24px; }
      .lightbox-nav { bottom: 25px; right: 24px; gap: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lightbox, .lightbox.open, .lightbox-img { transition: none; }
    }
  </style>

  <script>
    // continuous scroll-linked fade: each photo's opacity reflects how close
    // a row is fully opaque as long as it's comfortably inside the viewport;
    // it only starts fading once it gets within FADE_ZONE px of the top edge
    // (about to slide under the header) or the bottom edge (not yet fully
    // scrolled into view), reaching 0 right at the edge. Recalculated every
    // scroll frame, so it's fully reversible in both directions.
    const fadeEls = document.querySelectorAll('.fade-img');
    const FADE_ZONE = 180;

    function updateFade() {
      const viewportH = window.innerHeight;
      fadeEls.forEach((el) => {
        const rect = el.getBoundingClientRect();
        const center = rect.top + rect.height / 2;

        let opacity = 1;
        if (center < FADE_ZONE) {
          opacity = Math.max(0, center / FADE_ZONE);
        } else if (center > viewportH - FADE_ZONE) {
          opacity = Math.max(0, (viewportH - center) / FADE_ZONE);
        }
        el.style.opacity = opacity;
      });
    }

    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        updateFade();
        ticking = false;
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    updateFade();

    // lightbox: click a photo to view it large. Shows the already-loaded
    // thumbnail straight away and swaps in the full-size file once it's
    // downloaded. Arrow keys / swipe to browse, Escape or click to close.
    const cells = [...document.querySelectorAll('.photos-cell')];
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const counter = document.getElementById('lightbox-counter');
    let current = -1;
    let lastFocus = null;

    const fullCache = new Map();
    const fullReady = new Set();
    function loadFull(index) {
      const i = (index + cells.length) % cells.length;
      const src = cells[i].querySelector('img').dataset.full;
      if (!fullCache.has(src)) {
        const img = new Image();
        img.decoding = 'async';
        img.src = src;
        fullCache.set(src, img.decode().then(() => { fullReady.add(src); return src; }, () => src));
      }
      return fullCache.get(src);
    }

    function show(index) {
      current = (index + cells.length) % cells.length;
      const thumb = cells[current].querySelector('img');
      const full = thumb.dataset.full;
      const shown = current;
      lightboxImg.src = fullReady.has(full) ? full : (thumb.currentSrc || thumb.src);
      loadFull(current).then((src) => { if (current === shown) lightboxImg.src = src; });
      // warm up the neighbours so Previous / Next swap straight to full size
      loadFull(current + 1);
      loadFull(current - 1);
      counter.textContent = `${current + 1} / ${cells.length}`;
    }

    function openLightbox(index) {
      lastFocus = document.activeElement;
      show(index);
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.documentElement.classList.add('lightbox-open');
      document.getElementById('lightbox-close').focus({ preventScroll: true });
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.documentElement.classList.remove('lightbox-open');
      current = -1;
      if (lastFocus) lastFocus.focus({ preventScroll: true });
    }

    cells.forEach((cell, i) => cell.addEventListener('click', () => openLightbox(i)));
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', () => show(current - 1));
    document.getElementById('lightbox-next').addEventListener('click', () => show(current + 1));
    // clicking the backdrop or the photo itself closes it
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lightboxImg) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (current < 0) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') show(current - 1);
      else if (e.key === 'ArrowRight') show(current + 1);
    });

    let touchX = null;
    lightbox.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    });
  </script>
</body>
</html>
