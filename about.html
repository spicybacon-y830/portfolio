  <style>
    .about-hero-desktop, .about-hero-mobile {
      width: 100%;
      object-fit: cover;
      display: block;
    }
    .about-hero-desktop { height: 639px; }
    .about-hero-mobile { display: none; height: 420px; }

    .about-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 80px;
      padding: var(--padding-xxxl);
      min-height: 570px;
    }

    .about-experience { display: flex; flex-direction: column; gap: 8px; }

    /* ReUI social buttons (c-button-36): outline icon buttons */
    .about-socials { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
    .social-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      color: var(--color-text);
      transition: background-color .15s ease;
    }
    .social-button:hover { background: var(--color-secondary); }
    .social-button:focus-visible { outline: 2px solid var(--color-text-muted); outline-offset: 2px; }
    .social-button svg { width: 16px; height: 16px; }
    .about-exp-row { display: flex; flex-direction: column; }
    .about-exp-title { display: flex; gap: 4px; font-size: 16px; line-height: 21.6px; }
    .about-exp-title .company { font-weight: 400; }
    .about-exp-title .role { font-weight: 300; font-size: inherit; line-height: inherit; color: inherit; }
    .about-exp-date { font-weight: 300; font-size: 12px; line-height: 21.6px; color: var(--color-text-faint); }

    @media (max-width: 767px) {
      .about-hero-desktop { display: none; }
      .about-hero-mobile { display: block; }

      .about-content {
        gap: 32px;
        padding: 24px;
        min-height: 0;
      }

      .about-exp-title { font-size: 12px; }
      .about-exp-date { font-size: 12px; }

    }
  </style>
