  <style>
    /* ══════════ INTRO LOADER (first visit of the session) ══════════ */
    /* reveal: the loader slides up out of the viewport while its content
       counter-slides down by the same amount, so the word stays put and the
       loader's bottom edge (the white wire) sweeps up the page. Only
       transforms are animated, so the whole wipe stays on the compositor
       (a clip-path wipe repainted every frame and made the page stutter) */
    .intro-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      background: var(--color-background);
      will-change: transform;
      transition: transform .9s cubic-bezier(.76, 0, .24, 1);
    }
    .intro-loader-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transition: transform .9s cubic-bezier(.76, 0, .24, 1);
    }
    .intro-loader::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--intro-wire);
      box-shadow: 0 0 10px var(--intro-wire-glow);
    }
    .intro-loader.done { transform: translateY(-100%); pointer-events: none; }
    .intro-loader.done .intro-loader-inner { transform: translateY(100%); }
    /* lens-scrolling word adapted from Uiverse.io by andrew-manzyk */
    .intro-word {
      --main-size: 4em;
      --intro-text: var(--color-text);
      --intro-shadow: var(--intro-shadow-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
      position: relative;
      font-family: 'Manrope', sans-serif;
      font-size: var(--main-size);
      font-weight: 500;
      text-transform: none;
      color: var(--intro-text);
      width: 7.3em;
      height: 1em;
    }
    .intro-word .text {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      position: absolute;
    }
    .intro-word .text:nth-child(1) {
      clip-path: polygon(0% 0%, 11.11% 0%, 11.11% 100%, 0% 100%);
      font-size: calc(var(--main-size) / 20); margin-left: -2.1em; opacity: 0.6;
    }
    .intro-word .text:nth-child(2) {
      clip-path: polygon(11.11% 0%, 22.22% 0%, 22.22% 100%, 11.11% 100%);
      font-size: calc(var(--main-size) / 16); margin-left: -0.98em; opacity: 0.7;
    }
    .intro-word .text:nth-child(3) {
      clip-path: polygon(22.22% 0%, 33.33% 0%, 33.33% 100%, 22.22% 100%);
      font-size: calc(var(--main-size) / 13); margin-left: -0.33em; opacity: 0.8;
    }
    .intro-word .text:nth-child(4) {
      clip-path: polygon(33.33% 0%, 44.44% 0%, 44.44% 100%, 33.33% 100%);
      font-size: calc(var(--main-size) / 11); margin-left: -0.05em; opacity: 0.9;
    }
    .intro-word .text:nth-child(5) {
      clip-path: polygon(44.44% 0%, 55.55% 0%, 55.55% 100%, 44.44% 100%);
      font-size: calc(var(--main-size) / 10); margin-left: 0em; opacity: 1;
    }
    .intro-word .text:nth-child(6) {
      clip-path: polygon(55.55% 0%, 66.66% 0%, 66.66% 100%, 55.55% 100%);
      font-size: calc(var(--main-size) / 11); margin-left: 0.05em; opacity: 0.9;
    }
    .intro-word .text:nth-child(7) {
      clip-path: polygon(66.66% 0%, 77.77% 0%, 77.77% 100%, 66.66% 100%);
      font-size: calc(var(--main-size) / 13); margin-left: 0.33em; opacity: 0.8;
    }
    .intro-word .text:nth-child(8) {
      clip-path: polygon(77.77% 0%, 88.88% 0%, 88.88% 100%, 77.77% 100%);
      font-size: calc(var(--main-size) / 16); margin-left: 0.98em; opacity: 0.7;
    }
    .intro-word .text:nth-child(9) {
      clip-path: polygon(88.88% 0%, 100% 0%, 100% 100%, 88.88% 100%);
      font-size: calc(var(--main-size) / 20); margin-left: 2.1em; opacity: 0.6;
    }
    .intro-word .text span {
      animation:
        intro-scrolling 2s linear infinite,
        intro-shadow 2s linear infinite;
    }
    .intro-word .text:nth-child(1) span {
      background: linear-gradient(to right, var(--intro-text) 4%, var(--intro-shadow) 7%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .text:nth-child(2) span {
      background: linear-gradient(to right, var(--intro-text) 9%, var(--intro-shadow) 13%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .text:nth-child(3) span {
      background: linear-gradient(to right, var(--intro-text) 15%, var(--intro-shadow) 18%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .text:nth-child(4) span {
      background: linear-gradient(to right, var(--intro-text) 20%, var(--intro-shadow) 23%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .text:nth-child(6) span {
      background: linear-gradient(to right, var(--intro-shadow) 29%, var(--intro-text) 32%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .text:nth-child(7) span {
      background: linear-gradient(to right, var(--intro-shadow) 34%, var(--intro-text) 37%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .text:nth-child(8) span {
      background: linear-gradient(to right, var(--intro-shadow) 39%, var(--intro-text) 42%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .text:nth-child(9) span {
      background: linear-gradient(to right, var(--intro-shadow) 45%, var(--intro-text) 48%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .intro-word .line {
      position: relative;
      overflow: hidden;
      height: 0.05em;
      width: calc(var(--main-size) / 2);
      margin-top: 0.9em;
      border-radius: 0.05em;
    }
    .intro-word .line::before,
    .intro-word .line::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--intro-text);
      border-radius: 0.05em;
    }
    .intro-word .line::before { opacity: 0.3; }
    .intro-word .line::after {
      transform: translateX(-100%);
      animation: intro-sweep 2s linear infinite;
    }
    @keyframes intro-sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    @keyframes intro-scrolling { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    @keyframes intro-shadow { from { background-position: -98% 0; } to { background-position: 102% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .intro-word .text span, .intro-word .line::after { animation: none; }
    }

    /* ══════════ DESKTOP MARQUEE (scroll-driven) ══════════ */
    .marquee-desktop-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      /* no justify-content:center here on purpose: the track is always wider
         than the viewport, so centering it just pre-shifts the resting
         position left by (trackWidth-viewportWidth)/2 - combined with the
         scroll wrap, that pushed the visible window past the end of the
         track's duplicated content and exposed blank background */
      overflow: hidden;
      width: 100%;
    }

    .marquee-desktop-track {
      display: flex;
      gap: 8px;
      width: max-content;
      will-change: transform;
    }

    /* ══════════ MARQUEE CARDS (project brand covers) ══════════
       All internal element sizes are percentages of the card's own box
       (or use height:auto to inherit the asset's intrinsic ratio) rather
       than fixed px - the exact same markup/classes render correctly at
       any card size, so desktop and mobile reuse identical HTML. */
    .marquee-card {
      position: relative;
      overflow: hidden;
      display: block;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .marquee-card.in { opacity: 1; transform: translateY(0); }

    .marquee-desktop-track .marquee-card { width: 696px; height: 447px; flex-shrink: 0; }

    .marquee-card .bg-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ══════════ MOBILE MARQUEE (native page scroll) ══════════ */
    .marquee-mobile { display: none; flex-direction: column; gap: 8px; padding: 16px; }
    .marquee-mobile .marquee-card { width: 100%; aspect-ratio: 354 / 237.86; }

    /* lock native page scroll on desktop: the wheel-driven marquee owns vertical input */
    @media (min-width: 768px) {
      html, body { height: 100%; overflow: hidden; }
    }

    @media (max-width: 767px) {
      .page { min-height: auto; }
      .marquee-desktop-wrap { display: none; }
      .marquee-mobile { display: flex; }
    }

  <script>
    // intro loader: shown once per session until the page has loaded, then
    // revealed from the bottom up at the end of a 2s pass of the animation
    (() => {
      const loader = document.getElementById('intro-loader');
      const cleanup = () => loader.remove();
      let seen = false;
      try { seen = sessionStorage.getItem('introSeen') === '1'; sessionStorage.setItem('introSeen', '1'); } catch (e) {}
      if (seen) { cleanup(); return; }
      const PASS = 2000;
      const start = performance.now();
      window.addEventListener('load', () => {
        const elapsed = performance.now() - start;
        const wait = Math.max(1, Math.ceil(elapsed / PASS)) * PASS - elapsed;
        setTimeout(() => {
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) { cleanup(); return; }
          loader.classList.add('done');
          loader.addEventListener('transitionend', (e) => {
            if (e.target === loader) cleanup();
          });
        }, wait);
      }, { once: true });
    })();

  <script>
    // desktop marquee: horizontal scroll driven by vertical scroll input
    const track = document.getElementById('marquee-desktop-track');
    let loopWidth = 0;
    let target = 0;
    let current = 0;

    const uniqueCount = Number(track.dataset.uniqueCount);

    function measureLoopWidth() {
      // measure the real distance to the first duplicated image rather than
      // scrollWidth/(copies): with an odd number of gaps, dividing scrollWidth
      // lands a few px short of the true repeat period, which put the wrap
      // point mid-gap and flashed a sliver of background at the seam
      const children = track.children;
      loopWidth = children[uniqueCount].offsetLeft - children[0].offsetLeft;
    }
    measureLoopWidth();
    window.addEventListener('resize', measureLoopWidth);

    // start with Yampa centered in the viewport rather than Suma flush left
    const yampaCard = track.querySelector('.card-yampa');
    if (yampaCard) {
      const yampaCenter = yampaCard.offsetLeft + yampaCard.offsetWidth / 2;
      const startPosition = yampaCenter - window.innerWidth / 2;
      current = startPosition;
      target = startPosition;
      track.style.transform = `translateX(${-startPosition}px)`;
    }

    const isDesktop = () => window.matchMedia('(min-width: 768px)').matches;

    // cap a single wheel tick so a momentum-scroll spike can't fling the target far ahead
    const MAX_DELTA = 120;
    // trackpad momentum scrolling often ends with a tiny, sometimes reversed-sign
    // "settle" blip as the gesture decays to zero - without a floor, that blip
    // nudges target the opposite way for a frame and reads as a little bounce
    const MIN_DELTA = 2;
    // same slight speed reduction as the site-wide wheel scroll in script.js,
    // kept in sync for a consistent feel across pages
    const SCROLL_SPEED = 1;

    // target/current are deliberately NOT wrapped into [0, loopWidth) here -
    // they accumulate the true, unbounded scroll distance. Wrapping them per
    // event was the cause of the "bounce": during a fast scroll burst, target
    // could cross the wrap point several times between two animation frames,
    // and comparing two already-wrapped values made the "shortest path" logic
    // occasionally decide the closest way to the (aliased) target was
    // backwards, reversing the marquee for a frame. Unbounded accumulators
    // make target-current a plain, unambiguous distance - the wrap is only
    // applied once, at the very end, purely for display.
    window.addEventListener('wheel', (e) => {
      if (isDesktop()) e.preventDefault();
      if (Math.abs(e.deltaY) < MIN_DELTA) return;
      const delta = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, e.deltaY * SCROLL_SPEED));
      target += delta;
    }, { passive: false });

    // frame-rate independent easing: uses elapsed time instead of a fixed
    // per-frame step, so a stalled/throttled tab (e.g. backgrounded) catches
    // back up smoothly on the next frame instead of jumping or stuttering
    const EASE_PER_SECOND = 0.998;
    let lastTimestamp = null;

    function animateMarquee(timestamp) {
      if (lastTimestamp === null) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.25); // clamp huge gaps after a stall
      lastTimestamp = timestamp;

      const diff = target - current;
      const ease = 1 - Math.pow(1 - EASE_PER_SECOND, dt);
      current += diff * ease;

      // re-anchor both accumulators by the same whole number of loops once
      // they grow large, so they never lose float precision over a long
      // session - this never changes their difference, so motion is unaffected
      if (loopWidth && Math.abs(current) > loopWidth * 1000) {
        const loops = Math.floor(current / loopWidth) * loopWidth;
        current -= loops;
        target -= loops;
      }

      const displayX = loopWidth ? ((current % loopWidth) + loopWidth) % loopWidth : 0;
      track.style.transform = `translateX(${-displayX}px)`;
      requestAnimationFrame(animateMarquee);
    }
    requestAnimationFrame(animateMarquee);

    // fade the cards in on arrival, staggered by their position among the
    // 10 unique projects (desktop's duplicated second set reuses the same
    // stagger so it doesn't read as a delayed straggler)
    document.querySelectorAll('.marquee-card').forEach((card, i) => {
      card.style.transitionDelay = `${(i % 10) * 60}ms`;
    });
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.querySelectorAll('.marquee-card').forEach((card) => card.classList.add('in'));
      });
    });
  </script>
</body>
</html>
