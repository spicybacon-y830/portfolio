<head>

  <link rel="stylesheet" href="style.css">
  <style>
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 100px;
      padding: 24px var(--padding-xxxl);
    }

    .photos-cell {
      position: relative;
      aspect-ratio: 200 / 217;
      background: none;
      border: none;
      padding: 0;
    }

    .photos-cell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .fade-img {
      opacity: 0;
      transform: translateY(36px) scale(.9);
      transition: opacity 1s cubic-bezier(.25, 1, .5, 1), transform 1s cubic-bezier(.25, 1, .5, 1);
    }
    .fade-img.revealed { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .fade-img { transform: none; transition: opacity .4s ease; }
    }

    @media (max-width: 767px) {
      .photos-grid {
        display: flex;
        flex-direction: column;
        gap: 100px;
        padding: 24px;
      }
      .photos-cell { height: 211px; aspect-ratio: auto; }
    }

    /* ══════════ LIGHTBOX ══════════ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px var(--padding-xxxl);
      background: var(--color-background);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility 0s linear .3s;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
      transition: opacity .3s ease, visibility 0s;
    }
    html.lightbox-open { overflow: hidden; }

    /* fills the padded box and letterboxes via object-fit, so the displayed
       size depends only on the viewport - swapping the small thumbnail for
       the full-size file never changes it */
    /* the photo is a frame sized in px by script (fit at its own ratio,
       or one of three equal-area crops) with the picture as a cover
       background, so changing format animates width/height and reads as a
       crop, never a squash. */
    .lightbox-stage {
      position: relative;
      flex-shrink: 0;
      transform: scale(.98);
      transition: transform .4s cubic-bezier(.2, .8, .2, 1);
    }
    .lightbox.open .lightbox-stage { transform: none; }
    .lightbox-img {
      display: block;
      background-size: cover;
      background-position: center;
      user-select: none;
      transition:
        width .52s cubic-bezier(.34, 1.45, .64, 1),
        height .52s cubic-bezier(.34, 1.45, .64, 1),
        border-radius .52s cubic-bezier(.34, 1.45, .64, 1);
    }
    .lightbox-img.no-anim { transition: none; }

    /* floats in the lightbox's bottom row, between the counter and
       Previous / Next, outside the photo */
    .asp-tabs {
      position: absolute;
      left: 50%;
      bottom: 21px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 44px);
      height: 36px;
      padding: 3px;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--color-background) 55%, transparent);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
    }
    .asp-thumb {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: 44px;
      border-radius: 9999px;
      background: var(--color-background);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
      opacity: 0;
      transition: transform .52s cubic-bezier(.34, 1.45, .64, 1), opacity .2s ease;
    }
    .asp-tabs.has-choice .asp-thumb { opacity: 1; }
    .asp-tab {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      color: var(--color-text-muted);
      transition: color .2s ease;
    }
    .asp-tab:hover, .asp-tab[aria-checked="true"] { color: var(--color-text); }
    .asp-tab:focus-visible { outline: 1px solid var(--color-text-muted); outline-offset: -4px; border-radius: 9999px; }

    .lightbox-counter {
      position: absolute;
      font-weight: 300;
      font-size: 16px;
      line-height: 21.6px;
    }
    /* same thin cross as the site's close icon, drawn in currentColor so it
       can dim on hover */
    .lightbox-close {
      position: absolute;
      top: 28px;
      right: var(--padding-xxl);
      display: flex;
      width: 24px;
      height: 24px;
      background: none;
      border: none;
      padding: 0;
      color: var(--color-text);
      transition: color .15s ease;
    }
    .lightbox-close svg { width: 100%; height: 100%; display: block; }
    .lightbox-counter {
      bottom: 29px;
      left: var(--padding-xxl);
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
    }
    .lightbox-nav { position: absolute; bottom: 30px; right: var(--padding-xxl); display: flex; gap: 32px; }
    .lightbox-close:hover { color: var(--color-text-muted); }

    @media (max-width: 767px) {
      .lightbox { padding: 70px 24px 116px; }
      /* not enough room between the counter and Previous / Next */
      .asp-tabs { bottom: 62px; }
      .lightbox-counter { font-size: 12px; }
      .lightbox-close { top: 24px; right: 24px; }
      .lightbox-counter { bottom: 24px; left: 24px; }
      .lightbox-nav { bottom: 25px; right: 24px; gap: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lightbox, .lightbox.open, .lightbox-stage, .lightbox-img, .asp-thumb { transition: none; }
    }
  </style>

      <div class="lightbox-nav">
        <button class="link-button" id="lightbox-prev" type="button">
          <svg class="link-button-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          Previous
        </button>
        <button class="link-button" id="lightbox-next" type="button">
          Next
          <svg class="link-button-icon link-button-icon-end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <footer>
      <button class="theme-switch" id="theme-switch" type="button" aria-pressed="false" aria-label="Switch to dark mode">
        <span class="theme-switch-icons" aria-hidden="true"><svg class="theme-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><svg class="theme-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
      </button>
      <a class="footer-index" href="list">Index</a>
      <span class="location">Marseille, France</span>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    // reveal on scroll: each photo fades in while scaling up from 90% and
    // rising 36px whenever it enters the viewport, from either direction.
    // Once it has fully left the viewport it's reset, so it plays again on
    // the way back. Photos revealed in the same frame (a row) cascade left
    // to right.
    const revealEls = document.querySelectorAll('.fade-img');
    const REVEAL_STAGGER = 70;

    if ('IntersectionObserver' in window) {
      // reveals a little before the bottom edge so the motion is visible
      const revealObserver = new IntersectionObserver((entries) => {
        entries
          .filter((entry) => entry.isIntersecting && !entry.target.classList.contains('revealed'))
          .forEach((entry, i) => {
            entry.target.style.transitionDelay = `${i * REVEAL_STAGGER}ms`;
            entry.target.classList.add('revealed');
          });
      }, { rootMargin: '0px 0px -12% 0px' });
      // resets only once the photo is completely off screen
      const resetObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) return;
          entry.target.style.transitionDelay = '0ms';
          entry.target.classList.remove('revealed');
        });
      });
      revealEls.forEach((el) => {
        revealObserver.observe(el);
        resetObserver.observe(el);
      });
    } else {
      revealEls.forEach((el) => el.classList.add('revealed'));
    }

    // lightbox: click a photo to view it large. Shows the already-loaded
    // thumbnail straight away and swaps in the full-size file once it's
    // downloaded. Arrow keys / swipe to browse, Escape or click to close.
    const cells = [...document.querySelectorAll('.photos-cell')];
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const counter = document.getElementById('lightbox-counter');
    let current = -1;
    let lastFocus = null;

    const fullCache = new Map();
    const fullReady = new Set();
    function loadFull(index) {
      const i = (index + cells.length) % cells.length;
      const src = cells[i].querySelector('img').dataset.full;
      if (!fullCache.has(src)) {
        const img = new Image();
        img.decoding = 'async';
        img.src = src;
        fullCache.set(src, img.decode().then(() => { fullReady.add(src); return src; }, () => src));
      }
      return fullCache.get(src);
    }

    // ── format ── three crops of equal area, like the Aspect
    // component: landscape 4:3, square, portrait 3:4. -1 = the photo's own
    // ratio, uncropped.
    const SHAPES = [[1, .75], [Math.sqrt(.75), Math.sqrt(.75)], [.75, 1]];
    const tabsEl = document.getElementById('asp-tabs');
    const aspThumb = document.getElementById('asp-thumb');
    const aspTabs = [...tabsEl.querySelectorAll('.asp-tab')];
    let ratio = 1.5;
    let format = -1;

    function layout(animate) {
      const cs = getComputedStyle(lightbox);
      const bw = lightbox.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const bh = lightbox.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      let w, h;
      if (format < 0) {
        const k = Math.min(bw / ratio, bh);
        w = k * ratio; h = k;
      } else {
        // every crop fits in the same min(bw, bh) square, so the biggest
        // one never overflows and all three hold the same area
        const m = Math.min(bw, bh);
        w = m * SHAPES[format][0]; h = m * SHAPES[format][1];
      }
      lightboxImg.classList.toggle('no-anim', !animate);
      lightboxImg.style.width = `${Math.round(w)}px`;
      lightboxImg.style.height = `${Math.round(h)}px`;
      lightboxImg.style.borderRadius = format < 0 ? '0' : '18px';
      if (!animate) { lightboxImg.offsetWidth; lightboxImg.classList.remove('no-anim'); }
    }

    function setRatio(r) { ratio = r; layout(false); }

    function setFormat(i, animate, focus) {
      format = i;
      tabsEl.classList.toggle('has-choice', i >= 0);
      if (i >= 0) aspThumb.style.transform = `translateX(${i * 100}%)`;
      aspTabs.forEach((t, k) => {
        t.setAttribute('aria-checked', String(k === i));
        t.tabIndex = k === Math.max(i, 0) ? 0 : -1;
      });
      if (focus) aspTabs[i].focus();
      layout(animate);
    }

    aspTabs.forEach((t, i) => t.addEventListener('click', (e) => {
      // picking the chosen format again goes back to the uncropped photo
      setFormat(format === i ? -1 : i, true);
      // after a mouse click, hand the arrow keys back to Previous / Next;
      // keyboard users who tab into the bar keep arrows for the formats
      if (e.detail > 0) t.blur();
    }));
    tabsEl.addEventListener('keydown', (e) => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      e.stopPropagation(); // arrows here change format, not photo
      setFormat(((format < 0 ? (d > 0 ? -1 : 0) : format) + d + 3) % 3, true, true);
    });
    window.addEventListener('resize', () => { if (current >= 0) layout(false); });

    function show(index) {
      current = (index + cells.length) % cells.length;
      const thumb = cells[current].querySelector('img');
      const full = thumb.dataset.full;
      const shown = current;
      lightboxImg.style.backgroundImage = `url("${fullReady.has(full) ? full : (thumb.currentSrc || thumb.src)}")`;
      loadFull(current).then((src) => { if (current === shown) lightboxImg.style.backgroundImage = `url("${src}")`; });
      // each photo opens uncropped, at its own ratio
      setFormat(-1, false);
      if (thumb.naturalWidth) setRatio(thumb.naturalWidth / thumb.naturalHeight);
      else thumb.decode().then(() => { if (current === shown) setRatio(thumb.naturalWidth / thumb.naturalHeight); }, () => {});
      // warm up the neighbours so Previous / Next swap straight to full size
      loadFull(current + 1);
      loadFull(current - 1);
      counter.textContent = `${current + 1} / ${cells.length}`;
    }

    function openLightbox(index) {
      lastFocus = document.activeElement;
      show(index);
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.documentElement.classList.add('lightbox-open');
      document.getElementById('lightbox-close').focus({ preventScroll: true });
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.documentElement.classList.remove('lightbox-open');
      current = -1;
      if (lastFocus) lastFocus.focus({ preventScroll: true });
    }

    cells.forEach((cell, i) => cell.addEventListener('click', () => openLightbox(i)));
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', () => show(current - 1));
    document.getElementById('lightbox-next').addEventListener('click', () => show(current + 1));
    // clicking the backdrop or the photo itself closes it
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lightboxImg) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (current < 0) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') show(current - 1);
      else if (e.key === 'ArrowRight') show(current + 1);
    });

    let touchX = null;
    lightbox.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    });
  </script>
</body>
</html>
